name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Tests unitaires et d'intégration
        run: pytest -q
      - name: Évaluation rapide (recherche + abstention + réponses)
        run: PYTHONPATH=src python -m ragdoc.evaluate --rapide
      - name: Publier le rapport
        uses: actions/upload-artifact@v4
        with:
          name: rapport-evaluation
          path: reports/
